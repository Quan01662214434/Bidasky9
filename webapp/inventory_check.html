<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiểm Kho — BIDA SKY9</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { background: var(--bg-dark); }
        .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .back-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .items-table { width: 100%; border-collapse: collapse; }
        .items-table th, .items-table td { padding: 12px 8px; border-bottom: 1px solid var(--border); text-align: left; }
        .items-table th { font-weight: 500; color: var(--text-muted); font-size: 13px; }
        .input-qty { width: 70px; padding: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: #fff; text-align: center; }
        .input-qty:focus { outline: none; border-color: var(--primary); }
        .input-reason { width: 100%; padding: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: #fff; }
        .diff-pos { color: #10b981; font-weight: 600; }
        .diff-neg { color: #ef4444; font-weight: 600; }
        .diff-zero { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-shell" style="padding: 16px; max-width: 800px; margin: 0 auto; display: block;">
        <header class="page-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="page-title" style="margin: 0;">Kiểm Kê Kho</h1>
        </header>

        <div class="card" style="margin-bottom: 24px;">
            <div class="card-body" style="overflow-x: auto; padding: 0;">
                <table class="items-table" id="check-table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th style="text-align: center; width: 80px;">Tồn HT</th>
                            <th style="text-align: center; width: 90px;">Thực tế</th>
                            <th style="text-align: center; width: 60px;">Lệch</th>
                            <th style="width: 150px;">Lý do điều chỉnh</th>
                        </tr>
                    </thead>
                    <tbody id="items-tbody">
                        <tr><td colspan="5" style="text-align: center; padding: 20px;">Đang tải dữ liệu kho...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;" id="btn-submit" onclick="submitCheck()">LƯU KẾT QUẢ KIỂM KHO</button>
    </div>

    <script src="/static/inventory_check.js"></script>
</body>
</html>
